name: iOS

# 结构（目标：PR 反馈 ≤ 8 分钟）：
#   判定（Ubuntu：隐私 / 工程 / 版本校验 + 改动判定 + 同树已全绿则跳过）
#     ├─ Core 单元测试（Ubuntu，swift 官方容器，缓存 .build）—— 与 macOS 并行
#     └─ 编译与 UI 测试（macOS ×2 分片并行）：恢复模拟器 dyld 缓存 → build-for-testing（有缓存时模拟器并行启动）
#          → 预热（顺带跑完本片最短的用例）
#          → UI 测试（本片其余用例，失败的才重跑一次）；第 1 片额外打未签名 IPA 并按文件树命名上传，
#          供 main push 时「未签名 IPA」直接复用（scripts/ui-test-shards.py 按预计耗时给第 1 片少分一些用例）
#   → 汇总「iOS 构建与测试」（Ubuntu：记录已全绿的文件树）
# - 改动判定（scripts/ci-changes.py）：只改文档 / 契约 → 都跳过；只改 Core 测试 → 只跑 Core；
#   CHANGELOG.md 随 App 打包、UI 测试会检查，仍跑 macOS。
# - push main：若该提交的文件树与某个已全绿 run 的被测树完全相同（PR 在最新 main 上合并即如此），跳过重复测试。
# - UI 用例按 scripts/ui-test-shards.py 自动分片：新增用例不用改配置；分片数改 UI_SHARDS 与 matrix 即可。
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DESIGN.md"
      - "LICENSE"
      - "docs/**"
      - "contract/**"
      - ".github/workflows/contract.yml"
      - ".github/workflows/magpie-compat.yml"
      - ".github/workflows/ios-ipa.yml"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DESIGN.md"
      - "LICENSE"
      - "docs/**"
      - "contract/**"
      - ".github/workflows/contract.yml"
      - ".github/workflows/magpie-compat.yml"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # PR 上新 push 取消旧 run；main push 不互相取消，保证每次合并都有结果。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 用 iOS 27 SDK 编译（Xcode 27），部署目标 iOS 26。
  XCODE_APP: /Applications/Xcode_27.app
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  RESULTS_DIR: ${{ github.workspace }}/build/results
  GREEN_TREE_PREFIX: ios-green-tree-
  # UI 测试分片数（与 build-test 的 matrix.shard 保持一致）；第 1 片还要打 IPA（约 60 秒），少分一些用例。
  UI_SHARDS: "2"
  UI_SHARD_EXTRA: "0=60"

jobs:
  plan:
    name: 判定与快速校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tree: ${{ steps.decide.outputs.tree }}
      reason: ${{ steps.decide.outputs.reason }}
      ios: ${{ steps.changes.outputs.ios }}
      core: ${{ steps.changes.outputs.core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 隐私、工程与版本校验
        # 在便宜的 Ubuntu 上先做，失败就不必启动 macOS。
        run: |
          python3 scripts/check-privacy.py
          python3 scripts/check-xcodeproj-sources.py
          python3 scripts/check-ios-version.py

      - name: 改动判定
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci-changes.py
          echo "UI 测试分片："
          python3 scripts/ui-test-shards.py --shards "$UI_SHARDS" --extra "$UI_SHARD_EXTRA" --summary

      - name: 对比已全绿的被测文件树
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$REPO/$1"; }
          TREE=$(api "git/commits/$SHA" | jq -r .tree.sha)
          echo "被测提交 $SHA，文件树 $TREE"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          SKIP=false; REASON="完整执行"
          if [ "$EVENT" = "push" ]; then
            # 只认本仓库分支（非 fork）上「iOS」工作流成功结束的 run 留下的标记。
            for RUN in $(api "actions/artifacts?name=${GREEN_TREE_PREFIX}${TREE}&per_page=20" \
                | jq -r --argjson repo "$REPO_ID" '.artifacts[] | select(.expired | not)
                    | select(.workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo)
                    | .workflow_run.id'); do
              INFO=$(api "actions/runs/$RUN")
              if [ "$(jq -r .path <<<"$INFO")" = ".github/workflows/ios.yml" ] && [ "$(jq -r .conclusion <<<"$INFO")" = "success" ]; then
                SKIP=true
                REASON="文件树与 run $RUN（$(jq -r .event <<<"$INFO")，$(jq -r .head_branch <<<"$INFO")@$(jq -r '.head_sha[0:8]' <<<"$INFO")）已全绿的被测树相同，跳过重复测试"
                break
              fi
            done
          fi
          echo "$REASON"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

  core:
    name: Core 单元测试（Linux）
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.core == 'true'
    runs-on: ubuntu-latest
    # 官方 Swift 镜像（最新 6.x）；MagpieRemoteCore 只依赖 Foundation，Apple 专属代码在 #if canImport 之后。
    container: swift:6.4-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 缓存 .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: MagpieRemoteCore/.build
          key: core-linux-swift6.4-${{ hashFiles('MagpieRemoteCore/Package.swift', 'MagpieRemoteCore/Package.resolved', 'MagpieRemoteCore/Sources/**', 'MagpieRemoteCore/Tests/**') }}
          restore-keys: core-linux-swift6.4-

      - name: 编译
        run: |
          swift --version
          swift build --package-path MagpieRemoteCore --build-tests

      - name: MagpieRemoteCore 单元测试
        run: swift test --package-path MagpieRemoteCore --skip-build --parallel

  build-test:
    name: 编译与 UI 测试（${{ matrix.shard }}/2）
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 选择 Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "dyld_key=$(bash scripts/ci-sim-dyld-cache.sh key)" >> "$GITHUB_OUTPUT"

      # 镜像里没有预生成的模拟器 dyld 共享缓存：第一次调用 simctl 会现场生成好几分钟（3 核机器上编译、
      # 模拟器启动和 UI 测试都被拖慢）。在第一次调用 simctl 之前把缓存放回去（见 scripts/ci-sim-dyld-cache.sh）。
      - name: 恢复模拟器 dyld 缓存
        id: dyld
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sim-dyld
          key: ${{ steps.xcode.outputs.dyld_key }}

      - name: 选择模拟器
        id: simulator
        env:
          DYLD_HIT: ${{ steps.dyld.outputs.cache-hit }}
        run: |
          bash scripts/ci-sim-dyld-cache.sh restore "$RUNNER_TEMP/sim-dyld"
          UDID=$(python3 scripts/ci-select-simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          mkdir -p "$RESULTS_DIR"
          echo "SIM_T0=$(date +%s)" >> "$GITHUB_ENV"
          if [ "$DYLD_HIT" = "true" ]; then
            # 有缓存时模拟器启动很轻，和编译并行；没有缓存时并行会让编译从约 50 秒拖到 4–8 分钟，所以编译完再启动。
            nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/boot.log" 2>&1 &
            echo "模拟器已在后台启动"
          fi
          if command -v xcbeautify >/dev/null; then echo "beautify=xcbeautify --renderer github-actions" >> "$GITHUB_OUTPUT"; else echo "beautify=cat" >> "$GITHUB_OUTPUT"; fi

      - name: 本片用例
        run: |
          python3 scripts/ui-test-shards.py --shards "$UI_SHARDS" --extra "$UI_SHARD_EXTRA" --index $((SHARD - 1)) --list > "$RUNNER_TEMP/shard-tests.txt"
          python3 scripts/ui-test-shards.py --shards "$UI_SHARDS" --extra "$UI_SHARD_EXTRA" --index $((SHARD - 1)) --warmup > "$RUNNER_TEMP/warmup-test.txt"
          echo "第 $SHARD/$UI_SHARDS 片，$(wc -l < "$RUNNER_TEMP/shard-tests.txt" | tr -d ' ') 个用例（预热用 $(cat "$RUNNER_TEMP/warmup-test.txt")）："
          cat "$RUNNER_TEMP/shard-tests.txt"

      - name: 编译（build-for-testing）
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MagpieRemote.xcodeproj \
            -scheme MagpieRemote \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/Build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RESULTS_DIR/build.log" | ${{ steps.simulator.outputs.beautify }}

      - name: 启动模拟器并预热
        # 没有 dyld 缓存时编译完才启动模拟器（见「选择模拟器」）；有缓存时这里只是等后台启动完成。
        # 刚启动的模拟器前几次冷启动 App 很慢：用本片预计最短的用例预热（首屏等待放宽到 240 秒），
        # 同时完成 App 与测试运行器的安装。预热通过 = 该用例已通过，后面不再重复跑；最多 2 次，
        # 都没通过就把它留在正式测试里（以正式测试结果为准）。
        env:
          TEST_RUNNER_MAGPIE_REMOTE_WARMUP_TIMEOUT: "240"
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          T0=$(date +%s)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b > "$RUNNER_TEMP/bootstatus.log" 2>&1 || { cat "$RUNNER_TEMP/boot.log" "$RUNNER_TEMP/bootstatus.log" 2>/dev/null; exit 1; }
          echo "模拟器就绪：本步等待 $(( $(date +%s) - T0 )) 秒（距开始启动 $(( $(date +%s) - SIM_T0 )) 秒）"
          XCTESTRUN=$(ls "$DERIVED_DATA"/Build/Products/*.xctestrun | head -n 1)
          echo "XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"
          WARMUP=$(cat "$RUNNER_TEMP/warmup-test.txt")
          echo "WARMUP_PASSED=" >> "$GITHUB_ENV"
          [ -n "$WARMUP" ] || exit 0
          for i in 1 2; do
            START=$(date +%s)
            if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
                -resultBundlePath "$RUNNER_TEMP/warmup-$i.xcresult" \
                -parallel-testing-enabled NO \
                -collect-test-diagnostics never \
                "-only-testing:MagpieRemoteUITests/$WARMUP" > "$RUNNER_TEMP/warmup-$i.log" 2>&1; then
              echo "第 $i 次预热通过（$(( $(date +%s) - START )) 秒）：$WARMUP 已通过，正式测试不再重复"
              mv "$RUNNER_TEMP/warmup-$i.xcresult" "$RESULTS_DIR/Warmup.xcresult"
              echo "WARMUP_PASSED=$WARMUP" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "第 $i 次预热未通过（$(( $(date +%s) - START )) 秒），继续预热"
            grep -E "error:|failed" "$RUNNER_TEMP/warmup-$i.log" | head -n 5 || true
          done
          echo "::warning::预热 2 次仍未通过，$WARMUP 留在正式测试里（以测试结果为准）"

      - name: UI 测试（fixture 模式）
        # 失败的用例自动重跑一次（-retry-tests-on-failure 只重跑失败的那个，通过的不会再跑），两次都失败才判失败。
        run: |
          set -o pipefail
          ARGS=()
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            [ "$t" = "$WARMUP_PASSED" ] && continue
            ARGS+=("-only-testing:MagpieRemoteUITests/$t")
          done < "$RUNNER_TEMP/shard-tests.txt"
          if [ ${#ARGS[@]} -eq 0 ]; then echo "本片没有剩余用例"; exit 0; fi
          echo "正式测试 ${#ARGS[@]} 个用例"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RESULTS_DIR/UITests.xcresult" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -retry-tests-on-failure \
            -test-iterations 2 \
            "${ARGS[@]}" \
            2>&1 | tee "$RESULTS_DIR/test.log" | ${{ steps.simulator.outputs.beautify }}

      - name: 打包未签名 IPA（供 main push 同树复用）
        # 只在第 1 片打包。与「未签名 IPA」同一脚本、同一 Release 配置；build 号用工程默认值，复用时由 ios-ipa.yml 改写为它的 run_number。
        if: matrix.shard == 1
        run: |
          set -o pipefail
          bash scripts/build-unsigned.sh "$GITHUB_WORKSPACE/build/ipa" 2>&1 | tee "$RESULTS_DIR/build-unsigned.log" | ${{ steps.simulator.outputs.beautify }}
          mkdir -p ipa-reuse
          cp build/ipa/MagpieRemote-unsigned.ipa ipa-reuse/
          { echo "tree=${{ needs.plan.outputs.tree }}"; echo "sha=${{ github.sha }}"; echo "run=${{ github.run_id }}"; } > ipa-reuse/source.txt
          ls -lh ipa-reuse

      - name: 上传未签名 IPA（按文件树命名）
        if: matrix.shard == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-unsigned-ipa-${{ needs.plan.outputs.tree }}
          path: ipa-reuse
          retention-days: 14
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: 打包模拟器 dyld 缓存
        # 缓存未命中时由第 2 片保存（第 1 片还要打 IPA）；main 上的「模拟器缓存预热」每天也会保存一份供所有 PR 使用。
        id: dyld-pack
        if: always() && matrix.shard == 2 && steps.dyld.outputs.cache-hit != 'true' && steps.xcode.outputs.dyld_key != ''
        run: bash scripts/ci-sim-dyld-cache.sh pack "$RUNNER_TEMP/sim-dyld"

      - name: 保存模拟器 dyld 缓存
        if: always() && steps.dyld-pack.outputs.packed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sim-dyld
          key: ${{ steps.xcode.outputs.dyld_key }}

      - name: 打印失败的断言
        # 把 .xcresult 里每条失败用例的断言信息打成 ::error:: 注解并写入摘要，不用下载结果包也能看清原因。
        if: always()
        run: python3 scripts/print-xcresult-failures.py "$RESULTS_DIR/UITests.xcresult" "$RESULTS_DIR/Build.xcresult"

      - name: 上传结果包与日志
        # 无论成败都上传 .xcresult（含截图与无障碍树），失败时便于排查。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-results-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: build/results
          retention-days: 7
          if-no-files-found: ignore

  result:
    name: iOS 构建与测试
    needs: [plan, core, build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总结果
        env:
          SKIP: ${{ needs.plan.outputs.skip }}
          REASON: ${{ needs.plan.outputs.reason }}
          NEED_IOS: ${{ needs.plan.outputs.ios }}
          NEED_CORE: ${{ needs.plan.outputs.core }}
          PLAN: ${{ needs.plan.result }}
          CORE: ${{ needs.core.result }}
          BUILD: ${{ needs.build-test.result }}
        run: |
          echo "判定=$PLAN Core 单元测试=$CORE（需要：$NEED_CORE） 编译与 UI 测试=$BUILD（需要：$NEED_IOS）"
          if [ "$PLAN" = "success" ] && [ "$SKIP" = "true" ]; then
            echo "### 跳过重复测试" >> "$GITHUB_STEP_SUMMARY"
            echo "$REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ok() { [ "$1" = "success" ] || { [ "$1" = "skipped" ] && [ "$2" != "true" ]; }; }
          if [ "$PLAN" != "success" ] || ! ok "$CORE" "$NEED_CORE" || ! ok "$BUILD" "$NEED_IOS"; then
            echo "::error::iOS 构建与测试未全部通过"
            exit 1
          fi
          [ "$NEED_IOS" = "true" ] || echo "没有 App 相关改动，跳过 macOS" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$NEED_CORE" = "true" ] || echo "没有 Core 相关改动，跳过 Core 单元测试" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "全部通过"
          mkdir -p green && echo "${{ github.sha }}" > green/sha.txt

      - name: 记录已全绿的被测文件树
        # 供之后合并到 main 的 push 判定：文件树完全相同则不重复测试（IPA 也由同一 run 产出，所以要求 macOS 跑过）。
        if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.tree != '' && needs.build-test.result == 'success' && (needs.core.result == 'success' || needs.plan.outputs.core != 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.GREEN_TREE_PREFIX }}${{ needs.plan.outputs.tree }}
          path: green
          retention-days: 30
          overwrite: true
          if-no-files-found: error
