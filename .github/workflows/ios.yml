name: iOS

# 结构（目标：整条 PR 反馈 ≤ 15 分钟）：
#   判定（Ubuntu：隐私 / 工程 / 版本校验 + 改动判定 + 同树已全绿则跳过）
#     ├─ Core 单元测试（Ubuntu，swift 官方容器，缓存 .build）—— 与 macOS 并行
#     ├─ 编译与打包（macOS）：恢复 dyld 缓存与 Xcode 编译缓存 → build-for-testing → 上传测试产物
#     │     → 打未签名 IPA 并按文件树命名上传（与 UI 测试同时进行），供 main push 时「未签名 IPA」直接复用
#     └─ UI 测试 ×UI_JOBS（macOS，与编译同时开始）：启动模拟器 → 等测试产物 → 用本片最短的用例预热
#           → 跑本片其余用例（失败的才重跑一次）；逐帧截图（build/results/routes-frames）随结果包上传
#   → 汇总「iOS 构建与测试」（Ubuntu：记录已全绿的文件树）
# - 改动判定（scripts/ci-changes.py）：只改文档 / 契约 → 都跳过；只改 Core 测试 → 只跑 Core；
#   CHANGELOG.md 随 App 打包、UI 测试会检查，仍跑 macOS。
# - push main：若该提交的文件树与某个已全绿 run 的被测树完全相同（PR 在最新 main 上合并即如此），跳过重复测试。
# - UI 用例按 scripts/ui-test-shards.py 的预计耗时分给各 UI 测试 job：新增用例不用改配置；片数改 UI_JOBS 与 matrix.shard。
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DESIGN.md"
      - "LICENSE"
      - "docs/**"
      - "contract/**"
      - ".github/workflows/contract.yml"
      - ".github/workflows/magpie-compat.yml"
      - ".github/workflows/ios-ipa.yml"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DESIGN.md"
      - "LICENSE"
      - "docs/**"
      - "contract/**"
      - ".github/workflows/contract.yml"
      - ".github/workflows/magpie-compat.yml"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # PR 上新 push 取消旧 run；main push 不互相取消，保证每次合并都有结果。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 用 iOS 27 SDK 编译（Xcode 27），部署目标 iOS 26。
  XCODE_APP: /Applications/Xcode_27.app
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  RESULTS_DIR: ${{ github.workspace }}/build/results
  GREEN_TREE_PREFIX: ios-green-tree-
  # UI 测试分几个 macOS job 并行（与 ui-test job 的 matrix.shard 保持一致）。
  # 标准 xcode-27 runner 只有 3 核 / 7 GB，同一台上跑 2 台模拟器总吞吐不变（run 41297581636），所以按 job 拆分。
  UI_JOBS: "4"
  # Xcode 编译缓存（CAS）目录与 actions/cache key 前缀（「模拟器缓存预热」里用同样的值）。
  CAS_DIR: ${{ github.workspace }}/build/CompilationCache
  CAS_PREFIX: xcode-cas-v1-

jobs:
  plan:
    name: 判定与快速校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tree: ${{ steps.decide.outputs.tree }}
      reason: ${{ steps.decide.outputs.reason }}
      ios: ${{ steps.changes.outputs.ios }}
      core: ${{ steps.changes.outputs.core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 隐私、工程与版本校验
        # 在便宜的 Ubuntu 上先做，失败就不必启动 macOS。
        run: |
          python3 scripts/check-privacy.py
          python3 scripts/check-xcodeproj-sources.py
          python3 scripts/check-ios-version.py

      - name: 改动判定
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci-changes.py
          echo "UI 测试按 $UI_JOBS 个 job 的分配："
          python3 scripts/ui-test-shards.py --shards "$UI_JOBS" --summary

      - name: 对比已全绿的被测文件树
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$REPO/$1"; }
          TREE=$(api "git/commits/$SHA" | jq -r .tree.sha)
          echo "被测提交 $SHA，文件树 $TREE"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          SKIP=false; REASON="完整执行"
          if [ "$EVENT" = "push" ]; then
            # 只认本仓库分支（非 fork）上「iOS」工作流成功结束的 run 留下的标记。
            for RUN in $(api "actions/artifacts?name=${GREEN_TREE_PREFIX}${TREE}&per_page=20" \
                | jq -r --argjson repo "$REPO_ID" '.artifacts[] | select(.expired | not)
                    | select(.workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo)
                    | .workflow_run.id'); do
              INFO=$(api "actions/runs/$RUN")
              if [ "$(jq -r .path <<<"$INFO")" = ".github/workflows/ios.yml" ] && [ "$(jq -r .conclusion <<<"$INFO")" = "success" ]; then
                SKIP=true
                REASON="文件树与 run $RUN（$(jq -r .event <<<"$INFO")，$(jq -r .head_branch <<<"$INFO")@$(jq -r '.head_sha[0:8]' <<<"$INFO")）已全绿的被测树相同，跳过重复测试"
                break
              fi
            done
          fi
          echo "$REASON"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

  core:
    name: Core 单元测试（Linux）
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.core == 'true'
    runs-on: ubuntu-latest
    # 官方 Swift 镜像（最新 6.x）；MagpieRemoteCore 只依赖 Foundation，Apple 专属代码在 #if canImport 之后。
    container: swift:6.4-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 缓存 .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: MagpieRemoteCore/.build
          key: core-linux-swift6.4-${{ hashFiles('MagpieRemoteCore/Package.swift', 'MagpieRemoteCore/Package.resolved', 'MagpieRemoteCore/Sources/**', 'MagpieRemoteCore/Tests/**') }}
          restore-keys: core-linux-swift6.4-

      - name: 编译
        run: |
          swift --version
          swift build --package-path MagpieRemoteCore --build-tests

      - name: MagpieRemoteCore 单元测试
        run: swift test --package-path MagpieRemoteCore --skip-build --parallel

  build:
    name: 编译与打包
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.ios == 'true'
    runs-on: xcode-27
    # build-for-testing → 立刻把测试产物上传给各 UI 测试 job → 再打未签名 IPA（与 UI 测试同时进行）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 选择 Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          # 关掉 Spotlight 索引：否则它会去索引 DerivedData，跟编译抢 3 个核。
          sudo mdutil -a -i off > /dev/null 2>&1 || true
          xcodebuild -version
          echo "机器：$(sysctl -n hw.ncpu) 核，内存 $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          # 编译缓存通过 XCODE_XCCONFIG_FILE 交给本 job 里所有 xcodebuild（含打 IPA 的 build-unsigned.sh，脚本本身不用改）。
          printf 'COMPILATION_CACHE_ENABLE_CACHING = YES\nCOMPILATION_CACHE_CAS_PATH = %s\n' "$CAS_DIR" > "$RUNNER_TEMP/ci-cache.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/ci-cache.xcconfig" >> "$GITHUB_ENV"
          echo "dyld_key=$(bash scripts/ci-sim-dyld-cache.sh key)" >> "$GITHUB_OUTPUT"
          echo "xcode_build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          if command -v xcbeautify >/dev/null; then echo "beautify=xcbeautify --renderer github-actions" >> "$GITHUB_OUTPUT"; else echo "beautify=cat" >> "$GITHUB_OUTPUT"; fi

      # xcodebuild 即使用通用模拟器目标也会拉起 CoreSimulator；没有预生成的 dyld 共享缓存时会现场生成好几分钟。
      - name: 恢复模拟器 dyld 缓存
        id: dyld
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sim-dyld
          key: ${{ steps.xcode.outputs.dyld_key }}

      # Xcode 26+ 的编译缓存（COMPILATION_CACHE_ENABLE_CACHING）：按输入内容寻址，源码没变的文件直接取缓存结果，
      # 恢复旧版本的缓存也不会用错（内容变了就重新编译），所以可以放心用 restore-keys 取最近一份。
      # 缓存 key 跟 Xcode build 号走；main 上每天由「模拟器缓存预热」存一份干净的，PR 在此基础上补存自己的。
      - name: 恢复编译缓存
        id: cas
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CAS_DIR }}
          key: ${{ env.CAS_PREFIX }}${{ steps.xcode.outputs.xcode_build }}-${{ hashFiles('MagpieRemoteApp/**', 'MagpieRemoteUITests/**', 'MagpieRemoteCore/Sources/**', 'MagpieRemoteCore/Package.swift', 'MagpieRemote.xcodeproj/project.pbxproj', 'CHANGELOG.md') }}
          restore-keys: ${{ env.CAS_PREFIX }}${{ steps.xcode.outputs.xcode_build }}-

      - name: 编译（build-for-testing）
        # 用通用的「iOS Simulator」目标编译（只编 arm64）：不用等任何模拟器启动。
        id: build
        timeout-minutes: 20
        run: |
          set -o pipefail
          bash scripts/ci-sim-dyld-cache.sh restore "$RUNNER_TEMP/sim-dyld" || true
          mkdir -p "$RESULTS_DIR"
          START=$(date +%s)
          xcodebuild build-for-testing \
            -project MagpieRemote.xcodeproj \
            -scheme MagpieRemote \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/Build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildTimingSummary \
            2>&1 | tee "$RESULTS_DIR/build.log" | ${{ steps.xcode.outputs.beautify }}
          echo "编译用时 $(( $(date +%s) - START )) 秒（编译缓存 $(du -sh "$CAS_DIR" 2>/dev/null | cut -f1)）"
          # 用 tar 保留可执行权限与符号链接（artifact 本身不保留权限）。
          mkdir -p "$RUNNER_TEMP/products"
          tar -cf "$RUNNER_TEMP/products/products.tar" -C "$DERIVED_DATA/Build" Products
          ls -lh "$RUNNER_TEMP/products"

      - name: 上传测试产物（给各 UI 测试 job）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/products
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: 打包未签名 IPA（供 main push 同树复用）
        # 与「未签名 IPA」同一脚本、同一 Release 配置；build 号用工程默认值，复用时由 ios-ipa.yml 改写为它的 run_number。
        # 与各 UI 测试 job 同时进行，不占 PR 的等待时间。
        timeout-minutes: 15
        run: |
          set -o pipefail
          START=$(date +%s)
          bash scripts/build-unsigned.sh "$GITHUB_WORKSPACE/build/ipa" 2>&1 | tee "$RESULTS_DIR/build-unsigned.log" | ${{ steps.xcode.outputs.beautify }}
          echo "打包用时 $(( $(date +%s) - START )) 秒"
          mkdir -p ipa-reuse
          cp build/ipa/MagpieRemote-unsigned.ipa ipa-reuse/
          { echo "tree=${{ needs.plan.outputs.tree }}"; echo "sha=${{ github.sha }}"; echo "run=${{ github.run_id }}"; } > ipa-reuse/source.txt
          ls -lh ipa-reuse

      - name: 上传未签名 IPA（按文件树命名）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-unsigned-ipa-${{ needs.plan.outputs.tree }}
          path: ipa-reuse
          retention-days: 14
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: 检查编译缓存大小
        # 只在编译成功、缓存没有完全命中时保存；超过 2 GB 不存（下次从 main 的干净缓存起步），免得越滚越大。
        id: cas-size
        if: always() && steps.build.outcome == 'success' && steps.cas.outputs.cache-hit != 'true'
        run: |
          MB=$(du -sm "$CAS_DIR" 2>/dev/null | cut -f1)
          echo "编译缓存 ${MB:-0} MB"
          if [ -n "$MB" ] && [ "$MB" -gt 0 ] && [ "$MB" -le 2048 ]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi

      - name: 保存编译缓存
        if: always() && steps.cas-size.outputs.save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CAS_DIR }}
          key: ${{ steps.cas.outputs.cache-primary-key }}

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-results-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: build/results
          retention-days: 7
          if-no-files-found: ignore

  ui-test:
    name: UI 测试
    needs: plan
    # 与「编译与打包」同时开始：先启动模拟器（冷启动后几分钟后台服务很忙，正好和编译重叠），再等测试产物。
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 台数与 env.UI_JOBS 保持一致。用例按预计耗时均分（scripts/ui-test-shards.py），新增用例不用改配置。
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 选择 Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          sudo mdutil -a -i off > /dev/null 2>&1 || true
          xcodebuild -version
          echo "dyld_key=$(bash scripts/ci-sim-dyld-cache.sh key)" >> "$GITHUB_OUTPUT"

      # 镜像里没有预生成的模拟器 dyld 共享缓存：第一次调用 simctl 会现场生成好几分钟。
      # 在第一次调用 simctl 之前把缓存放回去（见 scripts/ci-sim-dyld-cache.sh）。
      - name: 恢复模拟器 dyld 缓存
        id: dyld
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sim-dyld
          key: ${{ steps.xcode.outputs.dyld_key }}

      - name: 选择并启动模拟器
        run: |
          bash scripts/ci-sim-dyld-cache.sh restore "$RUNNER_TEMP/sim-dyld"
          UDID=$(python3 scripts/ci-select-simulator.py)
          echo "$UDID" > "$RUNNER_TEMP/sim-udids.txt"
          mkdir -p "$RESULTS_DIR"
          nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/boot-1.log" 2>&1 &
          echo "模拟器 $UDID 已在后台启动（$(date +%T)）"
          echo "本片用例："
          python3 scripts/ui-test-shards.py --shards "$UI_JOBS" --index $(( ${{ matrix.shard }} - 1 )) --list

      - name: 等待测试产物
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ios-test-products-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$REPO/$1"; }
          START=$(date +%s)
          while :; do
            URL=$(api "actions/runs/$GITHUB_RUN_ID/artifacts?name=$NAME" | jq -r '.artifacts[0].archive_download_url // empty')
            [ -n "$URL" ] && break
            # 编译失败就不必再等。
            BUILD=$(api "actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=50" | jq -r '.jobs[] | select(.name == "编译与打包") | .conclusion // empty')
            if [ -n "$BUILD" ] && [ "$BUILD" != "success" ]; then echo "::error::编译与打包未成功（$BUILD），不再等待"; exit 1; fi
            sleep 5
          done
          echo "测试产物已就绪（等了 $(( $(date +%s) - START )) 秒）"
          echo "PRODUCTS_URL=$URL" >> "$GITHUB_ENV"
          echo "DL_T0=$(date +%s)" >> "$GITHUB_ENV"

      # 官方下载 action 并行分块下载（run 41319389079 里 curl 下 46 MB 要 70 多秒）；万一取不到，下一步用 curl 兜底。
      - name: 下载测试产物
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/products

      - name: 解压测试产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/products/products.tar" ]; then
            echo "::warning::download-artifact 没取到，改用 curl"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/products.zip" "$PRODUCTS_URL"
            unzip -q -o "$RUNNER_TEMP/products.zip" -d "$RUNNER_TEMP/products"
          fi
          mkdir -p "$DERIVED_DATA/Build"
          tar -xf "$RUNNER_TEMP/products/products.tar" -C "$DERIVED_DATA/Build"
          echo "XCTESTRUN=$(ls "$DERIVED_DATA"/Build/Products/*.xctestrun | head -n 1)" >> "$GITHUB_ENV"
          echo "下载解压 $(( $(date +%s) - DL_T0 )) 秒"

      - name: UI 测试（fixture 模式）
        # 等模拟器启动完 → 用本片最短的用例预热（通过即算通过）→ 跑本片其余用例，失败的只重跑一次。细节见 scripts/ci-ui-tests.sh。
        # 步骤级超时：卡住时本步失败，后面的结果包上传照常进行（整个 job 超时会连日志都丢掉）。
        timeout-minutes: 30
        env:
          UI_JOB_INDEX: ${{ matrix.shard }}
        run: bash scripts/ci-ui-tests.sh "$RUNNER_TEMP/sim-udids.txt"

      - name: 打包模拟器 dyld 缓存
        # 缓存未命中时在这里保存（只由第 1 片保存）；main 上的「模拟器缓存预热」每天也会保存一份供所有 PR 使用。
        id: dyld-pack
        if: always() && matrix.shard == 1 && steps.dyld.outputs.cache-hit != 'true' && steps.xcode.outputs.dyld_key != ''
        run: bash scripts/ci-sim-dyld-cache.sh pack "$RUNNER_TEMP/sim-dyld"

      - name: 保存模拟器 dyld 缓存
        if: always() && steps.dyld-pack.outputs.packed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/sim-dyld
          key: ${{ steps.xcode.outputs.dyld_key }}

      - name: 打印失败的断言
        # 把 .xcresult 里每条失败用例的断言信息打成 ::error:: 注解并写入摘要，不用下载结果包也能看清原因。
        if: always()
        run: |
          shopt -s nullglob
          python3 scripts/print-xcresult-failures.py "$RESULTS_DIR"/UITests-*.xcresult

      - name: 上传结果包与日志
        # 无论成败都上传 .xcresult（含截图与无障碍树）与 build/results/routes-frames 逐帧截图。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-results-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: build/results
          retention-days: 7
          if-no-files-found: ignore

  result:
    name: iOS 构建与测试
    needs: [plan, core, build, ui-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总结果
        env:
          SKIP: ${{ needs.plan.outputs.skip }}
          REASON: ${{ needs.plan.outputs.reason }}
          NEED_IOS: ${{ needs.plan.outputs.ios }}
          NEED_CORE: ${{ needs.plan.outputs.core }}
          PLAN: ${{ needs.plan.result }}
          CORE: ${{ needs.core.result }}
          BUILD: ${{ needs.build.result }}
          UI: ${{ needs.ui-test.result }}
        run: |
          echo "判定=$PLAN Core 单元测试=$CORE（需要：$NEED_CORE） 编译与打包=$BUILD UI 测试=$UI（需要：$NEED_IOS）"
          if [ "$PLAN" = "success" ] && [ "$SKIP" = "true" ]; then
            echo "### 跳过重复测试" >> "$GITHUB_STEP_SUMMARY"
            echo "$REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ok() { [ "$1" = "success" ] || { [ "$1" = "skipped" ] && [ "$2" != "true" ]; }; }
          if [ "$PLAN" != "success" ] || ! ok "$CORE" "$NEED_CORE" || ! ok "$BUILD" "$NEED_IOS" || ! ok "$UI" "$NEED_IOS"; then
            echo "::error::iOS 构建与测试未全部通过"
            exit 1
          fi
          [ "$NEED_IOS" = "true" ] || echo "没有 App 相关改动，跳过 macOS" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$NEED_CORE" = "true" ] || echo "没有 Core 相关改动，跳过 Core 单元测试" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "全部通过"
          mkdir -p green && echo "${{ github.sha }}" > green/sha.txt

      - name: 记录已全绿的被测文件树
        # 供之后合并到 main 的 push 判定：文件树完全相同则不重复测试（IPA 也由同一 run 产出，所以要求 macOS 跑过）。
        if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.tree != '' && needs.build.result == 'success' && needs.ui-test.result == 'success' && (needs.core.result == 'success' || needs.plan.outputs.core != 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.GREEN_TREE_PREFIX }}${{ needs.plan.outputs.tree }}
          path: green
          retention-days: 30
          overwrite: true
          if-no-files-found: error
